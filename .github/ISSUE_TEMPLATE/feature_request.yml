name: Feature request
description: Suggest an improvement to the evaluation workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What evaluation workflow would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional notes on other approaches.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, examples, or related work-log IDs if helpful. Do not include secrets or private user data.
